# The backend is the `higgins` package in src/. Install it with its pinned dependencies:
#   pip install -e .                      (running it locally: editable, so it finds frontend/dist)
#   pip install -r requirements-dev.txt   (development: the above plus test and lint tools)
#   pip install .                         (API-only hosts such as Render: the site is on Vercel)

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "higgins"
version = "0.1.0"
description = "Event planning assistant: a rules engine computes the plan, AI personalises it."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
# One list of pins, shared with hosts that install from requirements.txt.
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend", "venv"]

[tool.ruff.lint]
# Lint rules only, no formatter: pyflakes, pycodestyle, bugbear, pyupgrade. Import sorting is
# left out: it would rewrite the compact wrapped imports this codebase uses, one name per line.
select = ["F", "E", "W", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is declared as a default argument by design.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.11"
files = ["src", "evals", "scripts"]
plugins = ["pydantic.mypy"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
